# Hugo sandboxes anything it shells out to. Hugoplate compiles Tailwind through
# Hugo's asset pipeline, so those binaries must be allowed explicitly. Kept
# narrow: only what the CSS pipeline actually needs.
[security]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']
  [security.node]
    [security.node.permissions]
      allowAddons = ["tailwindcss"]
      allowChildProcess = ["tailwindcss"]
      allowRead = [".", "..", "/"]
      allowWorker = ["tailwindcss"]
