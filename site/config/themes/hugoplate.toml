# Hugoplate is a starter template built on Hugo Modules, not a self contained
# theme. Upstream imports 26 external modules. This overlay imports a trimmed
# set and deliberately OMITS the following, which upstream enables by default:
#
#   adsense                        advertising network
#   seo-tools/google-tag-manager   third party tag injection
#   components/cookie-consent      only needed if you run trackers
#   components/open-remark         third party hosted comment service
#
# Two modules are kept because head.html calls them unconditionally and the
# build fails without them. Neither is a tracker:
#   pwa                    provides the "manifest" partial, a web app manifest
#   seo-tools/site-verifications   emits ownership meta tags, and emits nothing
#                                  at all unless you configure a verification id
#
# The advertising and analytics partials (adsense, gtm, matomo, plausible,
# baidu, counter, google_analytics) ARE referenced by the templates, but every
# one of those calls is guarded by a config condition. With the modules absent
# and the config unset, the guards are false and the partials are never
# reached. Verified by building successfully without them.
#
# The point is that restai.ee claims no tracking, no advertising and no third
# party analytics. That claim should hold in the dependency tree, not just in
# the configuration.
#
# The remaining modules are vendored into site/_vendor, so builds are offline,
# reproducible and auditable. Re-vendor with: ./scripts/vendor-modules.sh

[module]
  # Use our own pinned submodule rather than fetching the theme over the network.
  replacements = "github.com/zeon-studio/hugoplate -> hugoplate"

  [module.hugoVersion]
    extended = true
    min = "0.158.0"

  [[module.imports]]
    path = "github.com/zeon-studio/hugoplate"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/pwa"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/seo-tools/site-verifications"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/images"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/videos"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/search"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/icons/font-awesome"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/accordion"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/table-of-contents"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/tab"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/modal"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/gallery-slider"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/components/preloader"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/components/social-share"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/components/custom-script"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/components/render-link"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/components/announcement"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/shortcodes/button"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/shortcodes/notice"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/seo-tools/basic-seo"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/gzip-caching"

# Parameters below are taken from Hugoplate's own exampleSite, because a
# starter template expects the project to supply them. Branding values are
# ours; logo images are left empty so the theme falls back to logo_text
# rather than shipping Hugoplate artwork.
[params]
#################### default parameters ############################
# favicon module: https://github.com/gethugothemes/hugo-modules/tree/master/images#favicon-implementation
  favicon = ""
# logo module: https://github.com/gethugothemes/hugo-modules/tree/master/images#logo-implementation
  logo = ""
  logo_darkmode = ""
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
  logo_width = "160px"
  logo_height = "32px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
  logo_webp = true
# logo text will only show when logo is missing.
  logo_text = "REST AI"
# navbar fixed to top
  navbar_fixed = true
# theme-mode
  theme_switcher = true
  theme_default = "system" # available options [light/dark/system]
# Main Sections
  mainSections = ["blog"]
# contact form action
  contact_form_action = "#" # contact form works with [https://airform.io/] or [https://formspree.io]
# google tag manager, see https://developers.google.com/tag-manager/
  google_tag_manager = "" # example: G-XXXXXXXXXX
  google_adsense = ""     # example: ca-pub-xxxxxxxxxxxxxxxx
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
  custom_script = ""
# copyright
  copyright = "Designed & Developed by [Zeon Studio](https://zeon.studio)"

# Preloader
# preloader module: https://github.com/gethugothemes/hugo-modules/tree/master/components/preloader
  [preloader]
  enable = false
  preloader = "" # use jpg, png, svg or gif format.

# Navigation button
  [navigation_button]
  enable = true
  label = "Github"
  link = "https://github.com/zeon-studio/hugoplate"

# LLMs Configuration
# LLMs module: https://github.com/gethugothemes/hugo-modules/tree/master/llms-txt
  [llms]
# Set to false to disable /llms.txt generation
  generate_llms_txt = true
# Set to false to disable /llms-full.txt generation
  generate_llms_full_txt = true
# Limit to specific paths (e.g. "/about/", "/blog/*", "/blog/**"). Empty = all pages.
  include = []
# Exclude specific paths (same wildcard formats as include). Include takes priority on conflicts.
  exclude = []

# search
# search module: https://github.com/gethugothemes/hugo-modules/tree/master/search
  [search]
  enable = true
  primary_color = "#121212"
  include_sections = ["blog"]
  show_image = true
  show_description = true
  show_tags = true
  show_categories = true

# announcement
# announcement module: https://github.com/gethugothemes/hugo-modules/tree/master/components/announcement
  [announcement]
  enable = true
  expire_days = 7
  content = "<span class='text-center block'>♥️ Loving Hugoplate? <a class='underline' href='https://github.com/zeon-studio/hugoplate' target='_blank' rel='noopener'>Please ⭐️ on Github</a></span>"

# seo meta data for OpenGraph / Twitter Card
# seo module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/basic-seo
  [metadata]
  keywords = ["Boilerplate", "Hugo"]
  description = "Hugo & Tailwindcss Starter"
  author = "zeon.studio"
  twitter = "zeon_studio"
  image = "images/og-image.png"


# site verifications
# verification module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/site-verifications
  [site_verification]
  google = ""   # Your verification code
  bing = ""     # Your verification code
  baidu = ""    # Your verification code
  facebook = "" # Your verification code
  mastodon = "" # Your verification code

# cookies
# cookies module: https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent
  [cookies]
  enable = false
  expire_days = 60
  content = "This site uses cookies. By continuing to use this website, you agree to their use."
  button = "I Accept"

# diagrams
  [mermaid]
  js_url = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs'

######################## sidebar widgets #########################
  [widgets]
  sidebar = ["categories", "tags"]


# google map
  [google_map]
  enable = false
  map_api_key = "" # Replace with your Google Maps API key
  map_latitude = "51.5223477"
  map_longitude = "-0.1622023"
  map_marker = "images/marker.png"


# Subscription
  [subscription]
  enable = false
# mailchimp subsciption
  mailchimp_form_action = "https://gmail.us4.list-manage.com/subscribe/post?u=463ee871f45d2d93748e77cad&amp;id=a0a2c6d074" # replace this url with yours
  mailchimp_form_name = "b_463ee871f45d2d93748e77cad_a0a2c6d074"

# OpenRemark Comments
  [open_remark]
  enable = true
  site_key = "cmq51sse6000504l2761vcywi"                 # your site key from the OpenRemark dashboard
  embed_url = "https://open-remark.zeon.studio/embed.js" # OpenRemark embed.js URL | Make sure it didn't change

