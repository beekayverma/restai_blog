# Blowfish expects an author table and its own appearance settings.
[params]
  colorScheme = "blowfish"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  [params.author]
    name = "Bhupender Verma"
    links = [{ linkedin = "https://www.linkedin.com/in/bhupender-v-042a2450/" }]
[params.article]
  showDate = true
  showAuthor = true
  showReadingTime = true

# A blog homepage should link its recent posts. Both themes support this as
# config, so no template override is needed.
[params.homepage]
  layout = "page"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/blog/"
